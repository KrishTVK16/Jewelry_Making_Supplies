<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Jewelora Supplies</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background-color: var(--tertiary);
        }

        .auth-card {
            background: var(--card-bg);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
        }
    </style>
</head>

<body>

    <div class="auth-container">
        <div class="auth-card text-center">
            <a href="index.html" class="navbar-brand mb-4 d-inline-block">
                JEWELORA SUPPLIES
                <small>Wholesale & Catalog</small>
            </a>

            <h2 class="h3 mb-4 font-serif">Welcome Back</h2>

            <form>
                <div class="mb-3 text-start">
                    <label class="form-label text-muted small text-uppercase fw-bold">Email Address</label>
                    <input type="email" class="form-control" placeholder="name@company.com">
                </div>

                <div class="mb-3 text-start">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label text-muted small text-uppercase fw-bold mb-0">Password</label>
                        <a href="#" class="small text-primary text-decoration-none">Forgot?</a>
                    </div>
                    <input type="password" class="form-control" placeholder="******">
                </div>

                <div class="form-check text-start mb-4">
                    <input class="form-check-input" type="checkbox" id="remember">
                    <label class="form-check-label small text-muted" for="remember">Remember me</label>
                </div>

                <a href="dashboard.html" class="btn btn-primary w-100 mb-3">Login</a>

                <div class="d-flex align-items-center my-4">
                    <hr class="flex-grow-1 m-0">
                    <span class="px-3 text-muted small">OR</span>
                    <hr class="flex-grow-1 m-0">
                </div>

                <button type="button" class="btn btn-outline-secondary w-100 mb-3 small">
                    <i class="bi bi-google me-2"></i> Continue with Google
                </button>
            </form>

            <p class="text-muted small mt-4">
                Don't have an account? <a href="register.html" class="text-primary fw-bold">Sign up</a>
            </p>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
</body>

</html>
